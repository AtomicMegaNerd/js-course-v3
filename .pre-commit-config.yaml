repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        language: system
        entry: biome
        pass_filenames: false

      - id: oxfmt
        name: oxfmt
        language: system
        entry: oxfmt
        types: [markdown]
        args: ["."]
        pass_filenames: false

      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2
        types: [markdown]
