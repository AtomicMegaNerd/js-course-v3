[tools]
node = "latest"
oxfmt = "latest"
tombi = "latest"
oxlint = "latest"
markdownlint-cli2 = "latest"
pre-commit = "latest"

# emmet-language-server
"npm:@olrtg/emmet-language-server" = "latest"

# Typescript
"npm:typescript" = "latest"

# The Rust based live-server is safer and faster
"cargo:live-server" = "latest"

[tools.rust]
version = "stable"
components = ["clippy", "rustfmt"]

[env]
CURR_PROJECT = "./first-js-code/"

[tasks.serve]
description = "Run live-server against $CURR_PROJECT"
run = """
live-server --host 127.0.0.1 --port 8080 $CURR_PROJECT
"""

[tasks.setup]
description = "Generate .pre-commit-config.yaml and install git hooks"
run = """
cat > .pre-commit-config.yaml << 'EOF'
repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        language: system
        entry: biome
        pass_filenames: false

      - id: oxfmt
        name: oxfmt
        language: system
        entry: oxfmt
        types: [markdown]
        args: ["."]
        pass_filenames: false

      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2
        types: [markdown]
EOF
pre-commit install
"""
